<style>
:root{--bg:#0B0F14;--s:#151B23;--s2:#1D2530;--ln:#263040;--tx:#E6EAF0;--mu:#8A94A3;--am:#F5A524;--rd:#F87171}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(120% 50% at 50% -10%,#17212D,var(--bg)) var(--bg);color:var(--tx);font:500 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{margin:0;font-size:20px;font-weight:700}h2{margin:0 0 8px;font-size:16px}
.hb{display:flex;gap:8px}
.pill{background:none;border:1px solid var(--ln);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--mu);transition:.2s}
.pill:active{transform:scale(.94)}.pill[data-m=err]{color:var(--rd);border-color:var(--rd)}
.cal,.day{background:var(--s);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:14px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav button{width:42px;height:42px;border:0;border-radius:12px;background:var(--s2);font-size:22px;line-height:1;transition:.12s}
.nav button:active{transform:scale(.88)}.nav button:disabled{opacity:.3;cursor:default}
.ttl{text-align:center}.ttl strong{display:block;font-size:17px}.ttl span{font-size:13px;color:var(--mu)}.ttl b{color:var(--tx);font-size:15px}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week span{text-align:center;font-size:12px;color:var(--mu);padding-bottom:4px}
.grid.sl{animation:sl .25s ease-out}.grid.sr{animation:sr .25s ease-out}
.d{position:relative;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1.5px solid transparent;border-radius:12px;background:var(--s2);padding:0;transition:transform .12s,background .2s,border-color .2s}
.d:active{transform:scale(.88)}
.d b{font-size:15px;font-weight:600}.d i{font-style:normal;font-size:10px;color:var(--mu);min-height:12px}
.d.today{box-shadow:inset 0 0 0 1.5px var(--mu)}
.d.has{background:rgba(245,165,36,.16);border-color:rgba(245,165,36,.6)}
.d.has i{color:var(--am);font-weight:700}
.d.has::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--am);box-shadow:0 0 0 3px rgba(245,165,36,.22)}
.d:disabled{background:none;color:#3A4453;cursor:default}
.d.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}.d.on i,.d.on.has i{color:#8A5A00}
.d.on.has::after{box-shadow:none}
.d.pop{animation:pop .5s}
.d.pop::before{content:"";position:absolute;inset:-2px;border-radius:14px;border:2px solid var(--am);animation:ring .7s forwards;pointer-events:none}
.lg{display:flex;align-items:center;gap:8px;margin:12px 0 0;color:var(--mu);font-size:13px}
.lg i{width:9px;height:9px;border-radius:50%;background:var(--am);box-shadow:0 0 0 3px rgba(245,165,36,.22)}
.day.sw{animation:up .25s ease-out}
.list{list-style:none;margin:0 0 12px;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}
.list li.n{animation:inn .35s ease-out}.list .e{color:var(--mu)}
.t{flex:1;min-width:0;overflow-wrap:anywhere}.t small{display:block;color:var(--rd);font-size:12px}
.a{font-weight:700;font-variant-numeric:tabular-nums}
.x{background:none;border:0;color:var(--mu);font-size:13px;padding:6px;border-radius:6px}.x.y{background:#7F1D1D;color:#fff}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.chips.tpl{grid-template-columns:repeat(2,1fr)}
.chips button{height:48px;border:1.5px solid var(--ln);border-radius:12px;background:var(--s2);font-weight:600;transition:transform .12s,background .2s,color .2s,border-color .2s}
.chips.tpl button{height:40px}.chips button:active{transform:scale(.93)}
.chips button.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.manual,#note{display:flex;align-items:center;gap:8px;width:100%;height:48px;margin-bottom:8px;padding:0 14px;border:1.5px solid var(--ln);border-radius:12px;background:var(--s2);transition:border-color .2s}
.manual:focus-within,#note:focus{border-color:var(--am)}
.manual input{flex:1;min-width:0;border:0;outline:0;background:none}.manual span{color:var(--mu)}
input::placeholder{color:var(--mu)}
.submit{width:100%;height:54px;border:0;border-radius:12px;background:var(--am);color:#1A1203;font-weight:700;transition:transform .1s,background .2s,color .2s}
.submit:active:not(:disabled){transform:scale(.97)}.submit:disabled{background:var(--s2);color:var(--mu);cursor:default}
.link{background:none;border:0;padding:8px 0;color:var(--mu);font-size:14px;text-decoration:underline}
.mh{display:flex;justify-content:space-between;margin-top:14px;padding-bottom:4px;border-bottom:2px solid var(--ln)}.m{color:var(--mu)}
.toast{position:fixed;left:50%;bottom:20px;z-index:30;max-width:calc(100vw - 32px);padding:11px 16px;border-radius:99px;background:var(--s2);border:1px solid var(--ln);font-size:15px;opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:#7F1D1D;border-color:#7F1D1D}
.lock{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:var(--bg);transition:opacity .35s,transform .35s}
.lock.out{opacity:0;transform:scale(1.05);pointer-events:none}
.brand{margin:0;font-size:22px;font-weight:700}.lock p{margin:0;color:var(--mu);font-size:14px;text-align:center;min-height:20px}
.dots{display:flex;gap:16px;margin:4px 0 8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mu);transition:.15s}
.dots i.f{background:var(--am);border-color:var(--am);transform:scale(1.2)}
.dots.bad{animation:shake .4s}.dots.bad i{background:var(--rd);border-color:var(--rd)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:0;background:var(--s2);font-size:26px;font-weight:600;transition:transform .1s,background .15s}
.pad button:active{transform:scale(.88);background:var(--ln)}.pad .z{background:none;color:var(--mu)}
@keyframes sl{from{opacity:0;transform:translateX(28px)}}
@keyframes sr{from{opacity:0;transform:translateX(-28px)}}
@keyframes up{from{opacity:.3;transform:translateY(10px)}}
@keyframes inn{from{opacity:0;transform:translateX(-14px)}}
@keyframes pop{40%{transform:scale(1.18)}}
@keyframes ring{to{opacity:0;transform:scale(1.5)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<noscript><p style="padding:24px">Aktifkan JavaScript untuk memakai Catat BBM.</p></noscript>

<div id="lock" class="lock" role="dialog" aria-modal="true" aria-label="Masukkan PIN">
  <p class="brand">Catat BBM</p>
  <p id="lm">Masukkan PIN</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
</div>

<main class="app" id="app" inert>
<header>
  <h1>Catat BBM</h1>
  <div class="hb"><button id="sync" class="pill" data-m="off">Memuat</button><button id="lk" class="pill">Kunci</button></div>
</header>

<section class="cal" id="cal" aria-label="Kalender pengeluaran BBM">
  <div class="nav">
    <button id="prev" aria-label="Bulan sebelumnya">‹</button>
    <div class="ttl"><strong id="mname"></strong><span><b id="mt">Rp 0</b> <small id="mc"></small></span></div>
    <button id="next" aria-label="Bulan berikutnya">›</button>
  </div>
  <div class="week"><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span><span>Min</span></div>
  <div class="grid" id="grid"></div>
  <p class="lg"><i></i>Hari isi BBM</p>
</section>

<section class="day" id="day" aria-label="Detail hari">
  <h2 id="dtitle"></h2>
  <ul class="list" id="dlist"></ul>
  <div class="chips" id="chips"></div>
  <label class="manual"><span>Rp</span><input id="manual" inputmode="numeric" autocomplete="off" placeholder="Nominal lain" aria-label="Nominal lain"></label>
  <input id="note" maxlength="120" placeholder="Catatan (opsional)" aria-label="Catatan">
  <div class="chips tpl" id="tpls"></div>
  <button id="submit" class="submit" disabled>Pilih nominal</button>
</section>

<section>
  <button id="toggle" class="link">Tampilkan semua riwayat</button>
  <div id="hist" hidden></div>
</section>
</main>
<div id="toast" class="toast" role="status"></div>

<script src="config.js"></script>
<script>
(()=>{'use strict';
const C=window.BBM_CONFIG||{},$=s=>document.querySelector(s),PL=4;
const PRE=[20000,30000,50000,100000,150000,200000],TPL=['Pertamax','Pertalite'],MAX=9999999,KP='bbm.pending.v1';
const HP=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const fmt=n=>String(Math.round(+n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const short=t=>t>=1e6?+(t/1e6).toFixed(1)+'jt':Math.round(t/1000)+'rb';
const long=s=>{const d=pd(s);return `${HP[d.getDay()]}, ${d.getDate()} ${BL[d.getMonth()]} ${d.getFullYear()}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(_){return[]}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};
try{localStorage.removeItem('bbm.rows.v1');localStorage.removeItem('bbm.token.v1')}catch(_){}
const norm=r=>({id:String(r.id),date:String(r.date).slice(0,10),amount:+r.amount||0,note:String(r.note||''),ts:+r.ts||0});
const vb=()=>navigator.vibrate&&navigator.vibrate(8);
const anim=(el,c)=>{el.classList.remove(c);void el.offsetWidth;el.classList.add(c)};
const reduce=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props||{})){
    if(v===false||v==null)continue;
    if(k==='text')e.textContent=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat()){if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)))}
  return e;
}

let today=iso(new Date()),pin='',ok=false,busy=false,fp=null,raf=0,tt;
const st={date:today,view:{y:new Date().getFullYear(),m:new Date().getMonth()},amount:0,
  rows:[],pend:ld(KP).map(norm),sync:'',all:false,pop:null,fresh:null};
const urlOk=()=>/^https:\/\/script\.google\.com\//.test(C.APPS_SCRIPT_URL||'');
const conf=()=>urlOk()&&ok;
const A=()=>{const ids=new Set(st.rows.map(r=>r.id));return[...st.rows,...st.pend.filter(p=>!ids.has(p.id))]};

// ---------- API ----------
async function api(action,p){
  if(!urlOk()||!pin){const e=new Error('nc');e.code='nc';throw e}
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
  try{
    const res=await fetch(C.APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({token:pin,action},p||{})),signal:ctl.signal});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const d=await res.json();
    if(!d.ok){const e=new Error(d.error||'Gagal');e.code=d.error;throw e}
    return d;
  }finally{clearTimeout(t)}
}
function fail(e){
  if(e&&(e.code==='unauthorized'||e.code==='terkunci'))lock(e.code==='terkunci'?'Terlalu banyak percobaan. Coba lagi 15 menit.':'Sesi berakhir. Masukkan PIN lagi.');
  else setSync('err');
}
function flush(){
  if(fp)return fp;
  if(!st.pend.length||!conf())return Promise.resolve();
  fp=(async()=>{
    setSync('busy');
    try{
      while(st.pend.length&&ok){
        const e=st.pend[0];
        await api('add',{id:e.id,date:e.date,amount:e.amount,note:e.note});
        st.pend=st.pend.filter(p=>p.id!==e.id);st.rows.push(e);sv(KP,st.pend);
        renderCal();renderDay();renderHist();
      }
      setSync('ok');
    }catch(e){fail(e)}
  })().finally(()=>{fp=null});
  return fp;
}
async function refresh(){
  if(!conf())return;
  setSync('busy');
  try{
    const d=await api('list');
    st.rows=d.rows.map(norm);
    const ids=new Set(st.rows.map(r=>r.id));
    st.pend=st.pend.filter(p=>!ids.has(p.id));sv(KP,st.pend);setSync('ok');
  }catch(e){fail(e)}
  if(ok){renderCal();renderDay();renderHist()}
}

// ---------- PIN ----------
function dots(){document.querySelectorAll('#dots i').forEach((e,i)=>e.classList.toggle('f',i<pin.length))}
function lock(msg){
  ok=false;pin='';busy=false;st.rows=[];dots();
  $('#app').inert=true;$('#lock').hidden=false;$('#lm').textContent=msg||'Masukkan PIN';
  requestAnimationFrame(()=>$('#lock').classList.remove('out'));
}
function press(k){
  if(busy||ok)return;
  if(!pin)$('#lm').textContent='Masukkan PIN';
  if(k==='<')pin=pin.slice(0,-1);else if(pin.length<PL)pin+=k;
  dots();
  if(pin.length===PL)tryUnlock();
}
async function tryUnlock(){
  busy=true;$('#lm').textContent='Memeriksa…';
  try{
    const d=await api('list');
    st.rows=d.rows.map(norm);ok=true;busy=false;
    st.pend=st.pend.filter(p=>!st.rows.some(r=>r.id===p.id));sv(KP,st.pend);
    $('#lock').classList.add('out');$('#app').inert=false;
    setTimeout(()=>{if(ok)$('#lock').hidden=true},400);
    renderAll();flush();
  }catch(e){
    $('#lm').textContent=e.code==='unauthorized'?'PIN salah':e.code==='terkunci'?'Terlalu banyak percobaan. Coba lagi 15 menit.':!urlOk()?'Isi APPS_SCRIPT_URL di config.js':'Gagal terhubung. Periksa koneksi.';
    anim($('#dots'),'bad');
    setTimeout(()=>{pin='';busy=false;dots();$('#dots').classList.remove('bad')},450);
  }
}

// ---------- Kalender ----------
function cnt(to){
  const el=$('#mt'),from=+el.dataset.v||0;el.dataset.v=to;cancelAnimationFrame(raf);
  if(from===to||reduce()){el.textContent='Rp '+fmt(to);return}
  const t0=performance.now();
  const f=n=>{const p=Math.min(1,(n-t0)/450);el.textContent='Rp '+fmt(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)raf=requestAnimationFrame(f)};
  raf=requestAnimationFrame(f);
}
function renderCal(dir){
  const{y,m}=st.view,key=`${y}-${pad(m+1)}`;
  const rs=A().filter(r=>r.date.startsWith(key));
  $('#mname').textContent=BL[m]+' '+y;$('#mc').textContent=rs.length+'x isi';
  cnt(rs.reduce((a,r)=>a+r.amount,0));
  const tot={};rs.forEach(r=>{tot[r.date]=(tot[r.date]||0)+r.amount});
  const lead=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  const g=$('#grid');g.replaceChildren();
  for(let i=0;i<lead;i++)g.append(h('span'));
  for(let d=1;d<=days;d++){
    const s=`${key}-${pad(d)}`,t=tot[s];
    g.append(h('button',{type:'button',class:'d'+(s===st.date?' on':'')+(s===today?' today':'')+(t?' has':'')+(s===st.pop?' pop':''),
      disabled:s>today,'aria-label':long(s)+(t?', isi BBM Rp '+fmt(t):''),
      onclick:()=>{vb();st.date=s;renderCal();renderDay();anim($('#day'),'sw')}},h('b',{text:d}),h('i',{text:t?short(t):''})));
  }
  st.pop=null;
  g.className='grid';if(dir&&!reduce()){void g.offsetWidth;g.classList.add(dir)}
  $('#next').disabled=key>=today.slice(0,7);
}
function go(n){
  const v=st.view,cur=+today.slice(0,4)*12+ +today.slice(5,7)-1,k=v.y*12+v.m+n;
  if(k>cur)return;
  v.y=Math.floor(k/12);v.m=k%12;renderCal(n>0?'sl':'sr');
}

// ---------- Detail hari ----------
function renderDay(){
  $('#dtitle').textContent=long(st.date);
  const ul=$('#dlist');ul.replaceChildren();
  const pids=new Set(st.pend.map(p=>p.id));
  const rs=A().filter(r=>r.date===st.date).sort((a,b)=>a.ts-b.ts);
  if(!rs.length){ul.append(h('li',{class:'e',text:'Belum ada isi BBM di tanggal ini'}));return}
  rs.forEach(r=>{
    let t;const x=h('button',{type:'button',class:'x',text:'Hapus'});
    x.onclick=()=>{
      if(x.classList.contains('y')){clearTimeout(t);remove(r.id);return}
      x.classList.add('y');x.textContent='Yakin?';
      t=setTimeout(()=>{x.classList.remove('y');x.textContent='Hapus'},3000);
    };
    ul.append(h('li',{class:r.id===st.fresh?'n':''},
      h('span',{class:'t'},r.note||'Tanpa catatan',pids.has(r.id)?h('small',{text:'belum terkirim'}):null),
      h('span',{class:'a',text:'Rp '+fmt(r.amount)}),x));
  });
  st.fresh=null;
}

// ---------- Form ----------
function buildForm(){
  PRE.forEach(p=>$('#chips').append(h('button',{type:'button','data-a':p,onclick:()=>{vb();st.amount=st.amount===p?0:p;$('#manual').value='';upd()}},(p/1000)+'rb')));
  TPL.forEach(t=>$('#tpls').append(h('button',{type:'button','data-t':t,onclick:()=>{vb();const n=$('#note');n.value=n.value===t?'':t;upd()}},t)));
}
function upd(){
  document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',+b.dataset.a===st.amount));
  document.querySelectorAll('#tpls button').forEach(b=>b.classList.toggle('on',b.dataset.t===$('#note').value));
  const s=$('#submit');s.disabled=st.amount<=0;
  s.textContent=st.amount>0?'Catat Rp '+fmt(st.amount):'Pilih nominal';
}
async function submit(){
  if(st.amount<=0)return;
  vb();
  const e={id:uid(),date:st.date,amount:st.amount,note:$('#note').value.trim().slice(0,120),ts:Date.now()};
  st.pend.push(e);sv(KP,st.pend);st.pop=e.date;st.fresh=e.id;
  st.amount=0;$('#manual').value='';$('#note').value='';
  upd();renderCal();renderDay();renderHist();renderStatus();
  await flush();
  if(ok&&st.pend.some(p=>p.id===e.id))await flush();
  const p=st.pend.some(x=>x.id===e.id);
  toast(!p?'Tersimpan: Rp '+fmt(e.amount):ok?'Belum terkirim, dicoba lagi nanti':'Tersimpan di perangkat, akan dikirim setelah PIN dimasukkan',p?'err':'');
}
async function remove(id){
  if(st.pend.some(p=>p.id===id)){
    st.pend=st.pend.filter(p=>p.id!==id);sv(KP,st.pend);
    renderCal();renderDay();renderHist();renderStatus();toast('Catatan dihapus');return;
  }
  const i=st.rows.findIndex(r=>r.id===id);if(i<0)return;
  const del=st.rows.splice(i,1)[0];renderCal();renderDay();renderHist();
  try{await api('delete',{id});toast('Catatan dihapus')}
  catch(e){st.rows.push(del);if(ok){renderCal();renderDay();renderHist()}fail(e);toast('Gagal menghapus','err')}
}

// ---------- Riwayat ----------
function renderHist(){
  const b=$('#hist');b.hidden=!st.all;
  $('#toggle').textContent=st.all?'Sembunyikan riwayat':'Tampilkan semua riwayat';
  if(!st.all)return;
  b.replaceChildren();
  const rs=A().sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  if(!rs.length){b.append(h('p',{class:'m',text:'Belum ada catatan.'}));return}
  const g=new Map();
  rs.forEach(r=>{const k=r.date.slice(0,7);if(!g.has(k))g.set(k,[]);g.get(k).push(r)});
  g.forEach((it,k)=>{
    const[y,m]=k.split('-').map(Number);
    b.append(
      h('div',{class:'mh'},h('b',{text:BL[m-1]+' '+y}),h('b',{text:'Rp '+fmt(it.reduce((a,r)=>a+r.amount,0))})),
      h('ul',{class:'list'},it.map(r=>h('li',null,
        h('span',{class:'t',text:pd(r.date).getDate()+' '+BL[m-1].slice(0,3)+(r.note?', '+r.note:'')}),
        h('span',{class:'a',text:fmt(r.amount)})))));
  });
}

// ---------- Status & toast ----------
function setSync(v){st.sync=v;renderStatus()}
function renderStatus(){
  const n=st.pend.length;let t,m;
  if(st.sync==='busy'){t='Menyinkronkan…';m='busy'}
  else if(st.sync==='err'||n){t=n?n+' belum terkirim':'Gagal terhubung';m='err'}
  else{t='Tersinkron';m='ok'}
  const s=$('#sync');s.dataset.m=m;s.textContent=t;
}
function toast(msg,kind){
  const t=$('#toast');t.textContent=msg;t.className='toast show '+(kind||'');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3000);
}
function renderAll(){upd();renderCal();renderDay();renderHist();renderStatus()}

// ---------- Mulai ----------
[1,2,3,4,5,6,7,8,9,'',0,'<'].forEach(k=>$('#pad').append(k===''?h('span'):h('button',{type:'button',class:k==='<'?'z':'','aria-label':k==='<'?'Hapus':String(k),onclick:()=>{vb();press(String(k))}},k==='<'?'⌫':String(k))));
buildForm();
$('#manual').addEventListener('input',e=>{
  const d=e.target.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,7);
  const n=d?Math.min(+d,MAX):0;
  e.target.value=n?fmt(n):'';st.amount=n;upd();
});
$('#manual').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit()}});
$('#note').addEventListener('input',upd);
$('#submit').onclick=submit;
$('#sync').onclick=()=>flush().then(refresh);
$('#lk').onclick=()=>lock();
$('#toggle').onclick=()=>{st.all=!st.all;renderHist()};
$('#prev').onclick=()=>go(-1);
$('#next').onclick=()=>go(1);
let sx=0;const cal=$('#cal');
cal.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
cal.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(dx<0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{if(ok)return;if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('<')});
window.addEventListener('online',()=>flush().then(refresh));
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!ok)return;
  const t=iso(new Date());
  if(t!==today){if(st.date===today)st.date=t;today=t;renderCal();renderDay()}
  flush().then(refresh);
});
})();
</script>
