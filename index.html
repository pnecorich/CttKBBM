<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E4E8EB">
  <title>Catat BBM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>Catat BBM</h1>
      <button class="sync" id="sync" type="button" data-mode="off">
        <span class="sync__dot"></span>
        <span id="sync-text">Memuat</span>
      </button>
    </header>

    <div class="banner" id="banner" hidden></div>

    <main class="layout">
      <section class="entry" aria-label="Catat pengisian baru">
        <div class="pump">
          <div class="lcd" id="lcd">
            <div class="lcd__top">
              <span>Bayar</span>
              <span id="lcd-date">Hari ini</span>
            </div>
            <div class="lcd__row">
              <span class="lcd__unit">Rp</span>
              <div class="lcd__digits" aria-live="polite">
                <span class="lcd__ghost" aria-hidden="true">8.888.888</span>
                <span class="lcd__value" id="lcd-value">0</span>
              </div>
            </div>
          </div>
        </div>

        <div class="field">
          <h2 class="field__title" id="lbl-date">Tanggal</h2>
          <div class="strip" id="strip" role="group" aria-labelledby="lbl-date"></div>
        </div>

        <div class="field">
          <h2 class="field__title" id="lbl-amount">Nominal</h2>
          <div class="chips" id="chips" role="group" aria-labelledby="lbl-amount"></div>
          <label class="manual">
            <span class="manual__rp">Rp</span>
            <input id="manual" type="text" inputmode="numeric" autocomplete="off" placeholder="Isi nominal lain" aria-label="Nominal lain, dalam rupiah">
          </label>
        </div>

        <div class="note">
          <button class="linkbtn" id="note-toggle" type="button" aria-expanded="false" aria-controls="note">+ Tambah catatan</button>
          <input id="note" type="text" maxlength="120" placeholder="mis. Pertalite penuh" aria-label="Catatan" hidden>
        </div>

        <button class="submit" id="submit" type="button" disabled>Pilih nominal dulu</button>
      </section>

      <section class="history" aria-label="Riwayat pengisian">
        <div class="summary" id="summary"></div>
        <div id="history"></div>
      </section>
    </main>

    <footer class="foot">
      <button class="linkbtn" id="reset-token" type="button">Ganti kode akses</button>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
